<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VoiceOS notch — preview</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background:
        linear-gradient(180deg, #1b4fd8 0%, #2f7ae5 26%, #7bb3f0 52%, #f2c14e 78%, #e8e3d8 100%);
      font-family: -apple-system, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    }
    .wallpaper-note {
      position: fixed; top: 140px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,.75); font-size: 13px; letter-spacing: .02em;
    }
    .controls {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
      background: rgba(255,255,255,.9); padding: 8px; border-radius: 999px;
      box-shadow: 0 6px 24px rgba(15,23,42,.12); z-index: 10;
    }
    .controls button {
      font: inherit; font-size: 12px; padding: 6px 13px; cursor: pointer;
      background: #fff; color: #374151;
      border: 1px solid #e5e7eb; border-radius: 999px;
    }
    .controls button:hover { background: #f9fafb; }
    .controls button.on { background: #111827; color: #fff; border-color: #111827; }
    iframe { width: 600px; height: 520px; border: 0; display: block; }
  </style>
</head>
<body>
  <div class="wallpaper-note">desktop behind the island</div>
  <iframe id="frame" src="index.html" scrolling="no"></iframe>

  <div class="controls">
    <button data-s="idle">idle</button>
    <button data-s="listening">listening</button>
    <button data-s="thinking">thinking</button>
    <button data-s="dictation">dictation result</button>
    <button data-s="agent">agent answer</button>
    <button data-s="confirm">needs approval</button>
    <button data-s="error">error</button>
  </div>

  <script>
    const frame = document.getElementById('frame');
    let waveTimer = null;

    function doc() { return frame.contentDocument; }

    function setState(state) {
      doc().getElementById('stage').dataset.state = state;
    }

    function clearBody() {
      const d = doc();
      d.getElementById('confirm').hidden = true;
      d.getElementById('askedText').textContent = '';
      d.getElementById('answerText').innerHTML = '';
      d.getElementById('foundList').innerHTML = '';
      d.getElementById('foundList').hidden = true;
      d.getElementById('meta').textContent = '';
    }

    function setAnswer(text) {
      const d = doc();
      const box = d.getElementById('answerText');
      box.innerHTML = '';
      for (const para of text.split(/\n{2,}/)) {
        const p = d.createElement('p');
        p.textContent = para.trim();
        box.appendChild(p);
      }
    }

    function setAsked(text) {
      doc().getElementById('askedText').textContent = text || '';
    }

    function setFound(items) {
      const d = doc();
      const list = d.getElementById('foundList');
      list.innerHTML = '';
      for (const it of items) {
        const li = d.createElement('li');
        li.className = 'found-item';
        li.innerHTML = it.icon
          ? '<img class="found-icon" src="../shared/icons/' + it.icon + '" alt="" />'
          : '<span class="found-glyph">' + (it.glyph || '*') + '</span>';
        const main = d.createElement('div');
        main.className = 'found-main';
        const t = d.createElement('div'); t.className = 'found-title'; t.textContent = it.title;
        const sub = d.createElement('div'); sub.className = 'found-sub'; sub.textContent = it.subtitle || '';
        main.append(t, sub);
        li.appendChild(main);
        list.appendChild(li);
      }
      list.hidden = items.length === 0;
    }

    function wave(active) {
      clearInterval(waveTimer);
      const d = doc();
      const canvas = d.getElementById('wave');
      const ctx = canvas.getContext('2d');
      const N = 44;
      const levels = new Array(N).fill(0.05);
      let phase = 0;
      waveTimer = setInterval(() => {
        phase += 0.22;
        levels.push(active ? Math.random() * 0.7 + 0.15 : 0.05);
        levels.shift();
        const { width, height } = canvas;
        ctx.clearRect(0, 0, width, height);
        const mid = height / 2;
        const g = ctx.createLinearGradient(0, 0, width, 0);
        g.addColorStop(0, '#5e5ce6'); g.addColorStop(0.28, '#64d2ff');
        g.addColorStop(0.55, '#ff6482'); g.addColorStop(0.78, '#bf5af2');
        g.addColorStop(1, '#5e5ce6');
        for (const st of [{a:1,s:1,o:0.95,w:2.4},{a:0.62,s:1.6,o:0.5,w:1.8},{a:0.38,s:2.3,o:0.3,w:1.4}]) {
          ctx.beginPath();
          for (let x = 0; x <= width; x++) {
            const t = x / width;
            const taper = Math.sin(Math.PI * t);
            const lv = levels[Math.round(t * (N - 1))];
            const y = mid + Math.sin(t * Math.PI * 4 + phase * st.s) * lv * mid * 0.92 * st.a * taper;
            x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          }
          ctx.strokeStyle = g; ctx.globalAlpha = st.o; ctx.lineWidth = st.w; ctx.lineCap = 'round';
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }, 70);
    }

    const SCENES = {
      idle() {
        clearBody(); wave(false);
        doc().getElementById('hint').textContent = '';
        doc().getElementById('timer').textContent = '';
        setState('idle');
      },
      listening() {
        clearBody(); wave(true);
        doc().getElementById('hint').textContent = 'Listening…';
        doc().getElementById('timer').textContent = '2.4s';
        setState('listening');
      },
      thinking() {
        clearBody(); wave(false);
        doc().getElementById('hint').textContent = 'Thinking…';
        doc().getElementById('timer').textContent = '';
        setState('thinking');
      },
      dictation() {
        clearBody(); wave(false);
        doc().getElementById('hint').textContent = '';
        doc().getElementById('timer').textContent = '';
        setState('answer');
        setAsked('');
        setAnswer('Send David the project update tomorrow, and ask whether the migration is still blocked.');
        doc().getElementById('meta').textContent = '1638ms';
      },
      agent() {
        clearBody(); wave(false);
        doc().getElementById('hint').textContent = '';
        doc().getElementById('timer').textContent = '';
        setState('answer');
        setAsked('Jarvis, what did I miss today?');
        setAnswer('You missed your package delivery, two scheduled meetings, and three assignments are due before Friday.');
        setFound([
          { icon: 'canvas.webp', title: 'Lab Report 4 — Physics 1112', subtitle: 'Due tomorrow, 11:59 PM' },
          { glyph: '📅', title: 'Two meetings', subtitle: 'Google Calendar' }
        ]);
        doc().getElementById('meta').textContent = '2.1s';
      },
      confirm() {
        SCENES.dictation();
        const d = doc();
        d.getElementById('label').textContent = 'Agent';
        d.getElementById('hint').textContent = '';
        setAnswer('I drafted the follow-up and it is ready to send.');
        d.getElementById('confirmApp').textContent = 'Gmail';
        d.getElementById('confirmTitle').textContent = 'Send this message?';
        d.getElementById('confirmGo').textContent = 'Send';
        d.getElementById('confirmEdit').hidden = false;
        const icon = d.getElementById('confirmIcon');
        icon.src = '../shared/icons/gmail.webp';
        icon.hidden = false;
        const rows = d.getElementById('confirmRows');
        rows.innerHTML = '';
        for (const [k, v] of [
          ['To:', 'hello@voiceos.com'],
          ['Subject:', 'Meeting tomorrow'],
          ['Message:', 'Hey team, just wanted to follow up on our meeting tomorrow…']
        ]) {
          const dt = d.createElement('dt'); dt.textContent = k;
          const dd = d.createElement('dd'); dd.textContent = v;
          rows.append(dt, dd);
        }
        d.getElementById('confirm').hidden = false;
      },
      error() {
        clearBody(); wave(false);
        doc().getElementById('hint').textContent = '';
        setState('error');
        setAsked('');
        setAnswer('Permission was denied. Allow the microphone in Windows Settings.');
      }
    };

    frame.addEventListener('load', () => {
      // The real renderer expects an IPC bridge; stub it so nothing throws.
      frame.contentWindow.voiceos = new Proxy({}, { get: () => () => () => {} });
      SCENES.agent();
      mark('agent');
    });

    function mark(name) {
      for (const b of document.querySelectorAll('.controls button')) {
        b.classList.toggle('on', b.dataset.s === name);
      }
    }

    for (const b of document.querySelectorAll('.controls button')) {
      b.addEventListener('click', () => { SCENES[b.dataset.s](); mark(b.dataset.s); });
    }
  </script>
</body>
</html>
