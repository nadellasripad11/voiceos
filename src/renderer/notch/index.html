<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>VoiceOS</title>
  <link rel="stylesheet" href="notch.css" />
</head>
<body>
  <div class="stage" id="stage" data-state="idle">
    <div class="pill" id="pill">
      <div class="glyph" aria-hidden="true">
        <span class="dot"></span>
      </div>

      <div class="body">
        <div class="row">
          <span class="mode" id="mode">Dictation</span>
          <span class="hint" id="hint">Listening…</span>
        </div>
        <canvas id="wave" class="wave" width="640" height="48" aria-hidden="true"></canvas>
        <div class="transcript" id="transcript"></div>
      </div>

      <div class="meta">
        <span class="timer" id="timer">0.0s</span>
        <button class="cancel" id="cancel" title="Cancel (Esc)" aria-label="Cancel">esc</button>
      </div>
    </div>

    <div class="toast" id="toast" hidden>
      <strong id="toastTitle"></strong>
      <span id="toastDetail"></span>
    </div>
  </div>

  <script src="notch.js"></script>
</body>
</html>
