<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>VoiceOS</title>
  <link rel="stylesheet" href="notch.css" />
</head>
<body>
  <!--
    The island. Fused to the top bezel, square where it meets the edge and
    rounded only below. At rest it is a small lozenge showing a level meter;
    speaking expands it; an answer expands it further into a reading panel.
  -->
  <div class="stage" id="stage" data-state="idle">
    <div class="card" id="card">

      <!-- Resting and listening: a single line -->
      <div class="bar">
        <canvas id="wave" class="wave" width="560" height="44" aria-hidden="true"></canvas>
        <span class="hint" id="hint"></span>
        <span class="timer" id="timer"></span>
      </div>

      <!-- Answer -->
      <div class="body" id="body">
        <div class="head">
          <span class="orb" id="orb" aria-hidden="true"></span>
          <button class="close" id="close" title="Dismiss (Esc)" aria-label="Dismiss">
            <svg viewBox="0 0 12 12" width="11" height="11">
              <path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>
            </svg>
          </button>
        </div>

        <p class="asked" id="askedText"></p>
        <div class="answer" id="answerText"></div>

        <ul class="found" id="foundList" hidden></ul>

        <div class="foot">
          <span class="foot-hint">
            Type or hold <kbd id="kbdA">ctrl</kbd> <kbd id="kbdB">shift</kbd> to speak
          </span>
          <span class="meta" id="meta"></span>
        </div>
      </div>

    </div>

    <!-- Approval. Floats below the island, pointing at it. -->
    <div class="sheet" id="confirm" hidden>
      <span class="sheet-arrow" aria-hidden="true"></span>
      <div class="sheet-inner">
        <img class="sheet-icon" id="confirmIcon" alt="" hidden />
        <span class="sheet-glyph" id="confirmGlyph">!</span>

        <div class="sheet-main">
          <div class="sheet-app" id="confirmApp"></div>
          <div class="sheet-title" id="confirmTitle"></div>
          <dl class="sheet-rows" id="confirmRows"></dl>
        </div>

        <div class="sheet-actions">
          <button class="sheet-btn sheet-go" data-act="approve" id="confirmGo">Send</button>
          <button class="sheet-btn sheet-alt" data-act="edit" id="confirmEdit">Edit</button>
        </div>

        <button class="sheet-close" data-act="cancel" aria-label="Cancel">
          <svg viewBox="0 0 12 12" width="11" height="11">
            <path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="notch.js"></script>
</body>
</html>
