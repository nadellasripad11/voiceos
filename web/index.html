<!doctype html>
<html lang="en" class="is-starting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef1f6" />
    <meta name="description" content="Jarvis. A quiet space for your thoughts, with an interactive singularity at its center." />
    <title>J.A.R.V.I.S. — Your personal assistant</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>html.is-starting{background:#0b1b38}html.is-starting .orbit-app{opacity:0}#startup{position:fixed;inset:0;background:#0b1b38;z-index:1000}</style>
    <noscript><style>#startup{display:none}html.is-starting .orbit-app{opacity:1}</style></noscript>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="startup" aria-hidden="true">
      <div class="startup-position">
        <svg class="startup-trace" viewBox="0 0 240 240"><circle cx="120" cy="120" r="112" pathLength="1"/></svg>
        <!-- Visualization: NASA’s Goddard Space Flight Center/Jeremy Schnittman.
             https://svs.gsfc.nasa.gov/13326 — displayed in monochrome. -->
        <video class="startup-hole" poster="/assets/startup-black-hole.jpg" muted playsinline preload="auto" tabindex="-1"><source src="/assets/startup-black-hole.webm" type="video/webm"><source src="/assets/startup-black-hole.mp4" type="video/mp4"></video>
      </div>
    </div>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-8H9v8H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v15l5-4h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/><path d="M7 10h.01M12 10h.01M17 10h.01" stroke-width="2.5"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 11h18M11 3v18"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9.5 3 .7-1h3.6l.7 2.5 1.5.9 2.6-.6 1.8 3.1-1.8 1.9v1.8l1.8 1.9-1.8 3.1-2.6-.6-1.5.9-.7 2.5h-3.6l-.7-2.5-1.5-.9-2.6.6L3.7 14l1.8-1.9v-1.8L3.7 8.4l1.8-3.1 2.6.6 1.4-.9z" transform="translate(0 1)"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect class="solid" x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v4M9 23h6"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="m21 3-7 18-3-8-8-3 18-7ZM11 13 21 3"/></symbol>
      <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 10v4M7 6v12M12 2v20M17 6v12M22 10v4"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5M3 3l6 6M21 3l-6 6M3 21l6-6M21 21l-6-6"/></symbol>
      <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M3 8h5V3M21 8h-5V3M8 21v-5H3M16 21v-5h5M3 3l5 5M21 3l-5 5M3 21l5-5M21 21l-5-5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9zM14 2v7h7M7 14h10M7 18h7"/></symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M7 16h10"/></symbol>
    </svg>

    <main class="orbit-app">
      <div class="ambient-light" aria-hidden="true"></div>
      <canvas id="singularity" aria-label="Animated black singularity with orbiting particles and flowing gravitational waves"></canvas>
      <div class="grain" aria-hidden="true"></div>

      <nav class="navigation glass" aria-label="Main navigation">
        <button class="nav-button active" data-panel="home" aria-label="Home" aria-pressed="true" data-tooltip="Home"><svg class="icon"><use href="#i-home"/></svg></button>
        <button class="nav-button" data-panel="conversations" aria-label="Conversations" aria-pressed="false" aria-controls="side-panel" aria-expanded="false" data-tooltip="Conversations"><svg class="icon"><use href="#i-chat"/></svg></button>
        <button class="nav-button" data-panel="workspace" aria-label="Workspace" aria-pressed="false" aria-controls="side-panel" aria-expanded="false" data-tooltip="Workspace"><svg class="icon"><use href="#i-grid"/></svg></button>
        <button class="nav-button" data-panel="settings" aria-label="Settings" aria-pressed="false" aria-controls="side-panel" aria-expanded="false" data-tooltip="Settings"><svg class="icon"><use href="#i-settings"/></svg></button>
      </nav>

      <section id="side-panel" class="side-panel glass" aria-label="Navigation panel" hidden></section>

      <section class="request-island glass" aria-label="Your current request">
        <div class="request-method" id="request-method"><svg class="icon"><use href="#i-wave"/></svg></div>
        <div class="request-content">
          <p id="current-request">What would you like to do?</p>
          <div class="request-status"><span class="status-ring" id="status-ring"></span><span id="request-status">Connecting to the local companion…</span></div>
        </div>
      </section>

      <div class="orbit-wordmark" aria-label="J.A.R.V.I.S."><span>J</span><span>A</span><span>R</span><span class="core-letter"></span><span>V</span><span>I</span><span>S</span></div>

      <section class="response-island glass" aria-label="Jarvis's response">
        <div class="response-avatar" aria-hidden="true"><span class="orbit-ring"></span></div>
        <div class="response-text" id="current-response">Your personal assistant is getting ready.</div>
        <button class="more-button" id="response-more" aria-label="Response options" aria-controls="response-menu" aria-expanded="false"><span></span><span></span><span></span></button>
        <div id="response-menu" class="popover glass response-menu" hidden>
          <button id="copy-response">Copy response</button>
          <button type="button" id="stop-speech">Stop speaking</button>
          <button id="replay-response">Read aloud <svg class="icon"><use href="#i-arrow"/></svg></button>
        </div>
      </section>

      <form class="composer glass" id="composer" aria-label="Message Jarvis">
        <button class="round-button attach-button" type="button" id="attach-button" aria-label="Add attachment" aria-controls="attach-menu" aria-expanded="false"><svg class="icon"><use href="#i-plus"/></svg></button>
        <input id="message-input" type="text" placeholder="Type a message or ask me anything..." aria-label="Your message" autocomplete="off" maxlength="8000" />
        <button class="round-button mic-button" id="mic-button" type="button" aria-label="Record a voice message" aria-pressed="false"><svg class="icon"><use href="#i-mic"/></svg></button>
        <button class="round-button send-button" type="submit" aria-label="Send message"><svg class="icon"><use href="#i-send"/></svg></button>
        <div id="attach-menu" class="popover glass attach-menu" hidden>
          <button id="choose-files" type="button"><svg class="icon"><use href="#i-file"/></svg> Attach files</button>
          <button id="use-example" type="button"><svg class="icon"><use href="#i-plus"/></svg> Try an example</button>
          <p>Selected text/audio is sent to Groq.</p>
        </div>
        <div id="attachment-chip" class="attachment-chip glass" hidden><svg class="icon"><use href="#i-file"/></svg><span id="attachment-name"></span><button type="button" id="remove-attachment" aria-label="Remove attachment"><svg class="icon"><use href="#i-close"/></svg></button></div>
      </form>

      <input id="file-input" type="file" multiple hidden />

      <aside class="task-panel glass" id="task-panel" aria-label="Tasks">
        <header class="task-header"><h1>Tasks</h1><button class="plain-button" id="close-tasks" aria-label="Close tasks"><svg class="icon"><use href="#i-close"/></svg></button></header>
        <section class="task-section" aria-labelledby="current-tasks-heading">
          <h2 id="current-tasks-heading">Current</h2>
          <div class="task-list"><p class="workspace-note">No active tasks.</p></div>
        </section>
        <section class="task-section upcoming" aria-labelledby="upcoming-tasks-heading">
          <h2 id="upcoming-tasks-heading">Upcoming</h2>
          <div class="task-list"><p class="workspace-note">Your scheduled tasks will appear here.</p></div>
        </section>
      </aside>
      <button class="restore-tasks glass" id="restore-tasks" aria-label="Open tasks" aria-controls="task-panel" aria-expanded="true" hidden><svg class="icon"><use href="#i-grid"/></svg><span>Tasks</span></button>
      <div class="toast glass" id="toast" role="status" aria-live="polite"></div>
      <div class="screen-reader-status" id="live-status" aria-live="polite"></div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
